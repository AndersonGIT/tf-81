<body class="site-page" data-page="midia">

  <main class="site-main">

    <!-- ══ HERO MINIMAL ══════════════════════════════════════ -->
    <section class="hero hero--minimal">
      <div class="hero__bg"></div>
      <div class="hero__overlay"></div>
      <div class="hero__content">
        <div class="hero__eyebrow">// CANAL YOUTUBE</div>
        <h1 class="hero__title">

      <div class="site-container" data-slot="midia-destaque">

            <div class="recruit-cta-bar__sub" data-slot="canal-inscritos">@tf81airsoft</div>
          </div>
          <a href="https://youtube.com/@tf81airsoft" class="btn btn-primary btn-lg" data-slot="canal-url" target="_blank" rel="noopener noreferrer">Acessar o canal</a>
